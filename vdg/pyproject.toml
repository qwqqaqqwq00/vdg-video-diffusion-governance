[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdg"
version = "0.1.0"
description = "VDG (Video Diffusion Governance): performance-energy simulation, repair/accel skill governance, and Pareto planning for heterogeneous video DiT deployment (LTX-2.3 centered)."
readme = "CONTRACTS.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "VDG" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vdg = "vdg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
filterwarnings = [
    "error::UserWarning",
]
